name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@v3

      - name: Deploy
        run: wasmer deploy --non-interactive --build-remote
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
